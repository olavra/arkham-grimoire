<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkham Grimoire</title>
<meta name="description" content="Browse the complete Arkham Horror: The Card Game collection, powered by the ArkhamDB API.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="img/favicon.svg" color="#24827b">
<link rel="apple-touch-icon" href="img/app/icon-192.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d1317">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/arkham-icons.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<header class="site-head" id="site-head">
  <!-- Fixed order, every route: brand, search, language and navigation left;
       Filters right. Route changes only ever hide a control, never move one. -->
  <div class="topbar">
    <div class="topbar-nav">
      <!-- Narrow windows only: the two section links fold into this menu so the
           brand and the search field can share the one row. -->
      <button type="button" class="btn-ghost nav-toggle" id="nav-toggle"
              aria-label="Sections" aria-expanded="false" aria-controls="nav-links">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <!-- Labelled on the link: the wordmark swaps for its initials on a phone,
           and whichever of the two is display:none is out of the a11y tree. -->
      <a class="brand" href="#/" aria-label="Arkham Grimoire">
        <span class="logo"></span>
        <span class="brand-full" aria-hidden="true">Arkham <span class="slash">Grimoire</span></span>
        <span class="brand-short" aria-hidden="true">A<span class="slash">G</span></span>
      </a>
      <!-- One global search, present on every route: it always queries the whole
           card pool, never whatever the current view happens to hold. It sits
           beside the brand and takes the bar's spare width. -->
      <label class="search" id="search-wrap">
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input type="search" id="search" placeholder="Search all cards…" autocomplete="off" spellcheck="false" aria-label="Search all cards">
      </label>
      <!-- Beside the search, because it decides what the search finds: ArkhamDB
           keeps each translation on its own subdomain, so this picks the host
           every card request goes to. A panel rather than a <select>:
           the native dropdown is painted by the OS and lands in the middle of
           the glass header looking like nothing else on the page. Options come
           from API.locales. -->
      <div class="lang" id="lang-wrap">
        <button type="button" class="btn-ghost lang-btn" id="lang-btn"
                aria-label="Card language" aria-haspopup="listbox"
                aria-expanded="false" aria-controls="lang-menu">
          <span class="lang-ico" aria-hidden="true">◈</span>
          <span class="lang-now" id="lang-now"></span>
        </button>
        <div class="pop-menu lang-menu" id="lang-menu" role="listbox" aria-label="Card language" hidden></div>
      </div>
      <!-- display:contents while there is room, so the links sit in the bar
           exactly as they did; a dropdown panel once there isn't. -->
      <div class="nav-links" id="nav-links">
        <a class="btn-ghost nav-btn" href="#/" id="cards-btn">Cards</a>
        <a class="btn-ghost nav-btn" href="#/packs" id="packs-btn">Packs</a>
        <a class="btn-ghost nav-btn" href="#/resources" id="resources-btn">Resources</a>
      </div>
      <a class="btn-ghost back-btn" id="back-btn" href="#/packs" hidden>
        <span aria-hidden="true">←</span><span>Back</span>
      </a>
    </div>

    <div class="topbar-tools">
      <!-- Named here too: the label is display:none on a narrow window, which
           takes it out of the accessibility tree along with the button's name. -->
      <button type="button" class="btn-ghost fb-toggle" id="filters-toggle" hidden
              aria-label="Filters" aria-expanded="true" aria-controls="filterbar">
        <svg class="fb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/>
        </svg><span class="fb-word">Filters</span><span class="fb-n" id="filters-n"></span>
      </button>
    </div>
  </div>

  <div class="filterbar" id="filterbar" hidden>
    <div class="fb-groups" id="fb-groups"></div>
  </div>

  <!-- Sibling of .filterbar, not a child: the bar scrolls its own overflow,
       which would clip a panel hanging off its bottom edge. -->
  <div class="pack-picker" id="pack-picker" hidden>
    <div class="pp-top">
      <label class="pp-search">
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input type="search" id="pp-q" placeholder="Find a pack…" autocomplete="off" spellcheck="false" aria-label="Find a pack">
      </label>
      <!-- The superseded switch is a pack filter, so it rides with the pack
           list rather than sitting in the topbar. -->
      <div class="pp-tools" id="pp-tools"></div>
    </div>
    <div class="pp-list" id="pp-list"></div>
  </div>

  <!-- Sibling of .filterbar for the same reason as the pack picker: its trigger
       lives inside the bar, but a panel parented to it would be clipped by the
       bar's own overflow. -->
  <div class="pop-menu sort-menu" id="sort-menu" role="listbox" aria-label="Sort by" hidden></div>
  <div class="pop-menu sort-menu" id="group-menu" role="listbox" aria-label="Group by" hidden></div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footline">
  <span class="pip" aria-hidden="true"></span>
  <span>Card data &amp; images &copy; Fantasy Flight Games — served by
    <a href="https://arkhamdb.com/api/" target="_blank" rel="noopener">ArkhamDB</a></span>
</footer>

<script src="js/api.js"></script>
<script src="js/packcovers.js"></script>
<script src="js/gameicons.js"></script>
<script src="js/iconindex.js"></script>
<script src="js/zip.js"></script>
<script src="js/packart.js"></script>
<script src="js/markup.js"></script>
<script src="js/cardback.js"></script>
<script src="js/faces.js"></script>
<script src="js/card3d.js"></script>
<script src="js/viewer.js"></script>
<script src="js/symviewer.js"></script>
<script src="js/askclaude.js"></script>
<script src="js/app.js"></script>
</body>
</html>
