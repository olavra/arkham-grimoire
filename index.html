<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkham Grimoire</title>
<meta name="description" content="Browse the complete Arkham Horror: The Card Game collection, powered by the ArkhamDB API.">
<link rel="icon" href="img/ico.svg" type="image/svg+xml">
<link rel="mask-icon" href="img/ico.svg" color="#6366f1">
<meta name="theme-color" content="#0a0e1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/arkham-icons.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<header class="site-head" id="site-head">
  <div class="topbar">
    <a class="brand" href="#/">
      <span class="logo"></span>
      <span>Arkham<span class="slash"> // </span>Grimoire</span>
    </a>

    <div class="topbar-tools">
      <a class="btn-ghost back-btn" id="back-btn" href="#/" hidden>
        <span aria-hidden="true">←</span><span>Back</span>
      </a>
      <button type="button" class="btn-ghost toggle-replaced" id="toggle-replaced" hidden
              aria-pressed="true" title="Deluxe boxes and Mythos Packs the Investigator / Campaign Expansions replaced">
        <span class="tt-label">Superseded</span><span class="tt-n"></span>
      </button>
      <label class="search" id="search-wrap" hidden>
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input type="search" id="search" placeholder="Filter cards…" autocomplete="off" spellcheck="false" aria-label="Filter cards">
      </label>
      <button type="button" class="btn-ghost fb-toggle" id="filters-toggle" hidden
              aria-expanded="true" aria-controls="filterbar">
        <span class="fb-ico" aria-hidden="true">≡</span><span class="fb-word">Filters</span><span class="fb-n" id="filters-n"></span>
      </button>
      <a class="btn-ghost" href="#/" id="home-btn">Packs</a>
    </div>
  </div>

  <div class="filterbar" id="filterbar" hidden>
    <div class="fb-groups" id="fb-groups"></div>
  </div>

  <!-- Sibling of .filterbar, not a child: the bar scrolls its own overflow,
       which would clip a panel hanging off its bottom edge. -->
  <div class="pack-picker" id="pack-picker" hidden>
    <label class="pp-search">
      <span class="search-ico" aria-hidden="true">⌕</span>
      <input type="search" id="pp-q" placeholder="Find a pack…" autocomplete="off" spellcheck="false" aria-label="Find a pack">
    </label>
    <div class="pp-list" id="pp-list"></div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footline">
  <span class="pip" aria-hidden="true"></span>
  <span>Card data &amp; images &copy; Fantasy Flight Games — served by
    <a href="https://arkhamdb.com/api/" target="_blank" rel="noopener">ArkhamDB</a></span>
</footer>

<script src="js/api.js"></script>
<script src="js/packcovers.js"></script>
<script src="js/markup.js"></script>
<script src="js/cardback.js"></script>
<script src="js/card3d.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
