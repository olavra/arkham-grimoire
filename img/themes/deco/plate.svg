<?xml version="1.0" encoding="UTF-8"?>
<!-- Button plate: a chamfered bar with stepped shoulders. Cut for border-image
     at a 44px slice, so the shoulders keep their shape and only the flat middle
     stretches with the label. -->
<svg xmlns="http://www.w3.org/2000/svg" width="264" height="56" viewBox="0 0 264 56" fill="none">
  <!-- face -->
  <path d="M22 3h220l10 10v30l-10 10H22L12 43V13z" fill="#0f1a18" fill-opacity=".85"/>
  <g stroke="#c9a961" stroke-linejoin="miter">
    <!-- outer chamfered keyline -->
    <path d="M22 3.5h220l9.5 9.5v30l-9.5 9.5H22L12.5 43V13z" stroke-width="1.5"/>
    <!-- inner hairline -->
    <path d="M24 8.5h216l7 7v25l-7 7H24l-7-7v-25z" stroke-width=".7" opacity=".6"/>
    <!-- stepped shoulders -->
    <g stroke-width="1.2">
      <path d="M12 20H4v16h8M252 20h8v16h-8"/>
      <path d="M8 24h-4v8h4M256 24h4v8h-4"/>
    </g>
  </g>
  <g fill="#c9a961">
    <rect x="30" y="26" width="4" height="4" transform="rotate(45 32 28)"/>
    <rect x="230" y="26" width="4" height="4" transform="rotate(45 232 28)"/>
  </g>
</svg>
